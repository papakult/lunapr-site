<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена · Luna PR</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23100f0d'/%3E%3Cpath d='M21 4a12 12 0 1 0 0 24 9.5 9.5 0 1 1 0-24z' fill='%23b9a47c'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23100f0d'/%3E%3Cpath d='M21 4a12 12 0 1 0 0 24 9.5 9.5 0 1 1 0-24z' fill='%23b9a47c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Golos+Text:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#100f0d;--bone:#ece9e1;--stone:#a49e91;--faint:#6d685e;
  --line:rgba(236,233,225,.14);--line-strong:rgba(236,233,225,.28);--champagne:#b9a47c;
  --serif:'Prata',serif;--sans:'Golos Text',sans-serif;
  --pad:clamp(24px,6vw,96px);--ease:cubic-bezier(.22,.6,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scrollbar-width:thin;scrollbar-color:var(--line-strong) var(--ink)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--ink)}
::-webkit-scrollbar-thumb{background:var(--line-strong);border:2px solid var(--ink);background-clip:padding-box}
body{
  background:var(--ink);color:var(--bone);font-family:var(--sans);font-weight:400;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  min-height:100svh;display:flex;flex-direction:column;
}
::selection{background:var(--bone);color:var(--ink)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1px solid var(--champagne);outline-offset:4px}

header{padding:0 var(--pad)}
.nav{display:flex;align-items:center;height:84px}
.wordmark{font-family:var(--serif);font-size:19px;letter-spacing:.30em;text-transform:uppercase}
.wordmark span{color:var(--stone)}

main{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:clamp(40px,8vw,0) var(--pad);position:relative;
}
.label{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--champagne);margin-bottom:24px;display:block}
.mark{
  font-family:var(--serif);font-size:clamp(90px,18vw,220px);line-height:1;
  color:transparent;-webkit-text-stroke:1px rgba(236,233,225,.20);
  letter-spacing:.02em;user-select:none;
}
h1{
  font-family:var(--serif);font-weight:400;font-size:clamp(26px,4vw,40px);
  line-height:1.3;max-width:20ch;margin-top:20px;
}
p{color:var(--stone);font-size:16px;max-width:48ch;margin-top:18px;line-height:1.7}
.action{
  display:inline-flex;align-items:center;gap:16px;margin-top:44px;
  font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--bone);
  padding-bottom:8px;border-bottom:1px solid var(--line-strong);
  transition:border-color .4s, gap .4s var(--ease);width:fit-content;
}
.action:hover{border-color:var(--bone);gap:26px}
.action i{font-style:normal;transition:transform .4s var(--ease)}

footer{border-top:1px solid var(--line);padding:28px var(--pad) 32px}
.foot-bottom{
  display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
  font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);
}

@media(max-width:560px){.mark{font-size:clamp(70px,26vw,120px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="wordmark" href="index.html">Luna&nbsp;PR<span>&nbsp;·&nbsp;СНГ</span></a>
  </div>
</header>

<main>
  <span class="label">Ошибка 404</span>
  <span class="mark" aria-hidden="true">Луна&nbsp;зашла</span>
  <h1>Такой страницы больше нет — либо она никогда не существовала</h1>
  <p>Проверьте адрес или вернитесь на главную: оттуда легко попасть в любой раздел сайта.</p>
  <a class="action" href="index.html">На главную <i>&rarr;</i></a>
</main>

<footer>
  <div class="foot-bottom">
    <span>© 2026 Luna PR СНГ</span>
    <span>lunapr.ru</span>
  </div>
</footer>

</body>
</html>
